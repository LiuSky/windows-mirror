name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Server 2022 / VS 2022 / x64
            os: windows-2022
            generator: Visual Studio 17 2022
            architecture: x64
            artifact: valeria-windows-vs2022-x64
          - name: Windows Server 2025 / VS 2026 / x64
            os: windows-2025-vs2026
            generator: Visual Studio 18 2026
            architecture: x64
            artifact: valeria-windows-vs2026-x64
          - name: Windows 11 / VS 2026 / ARM64
            os: windows-11-vs2026-arm
            generator: Visual Studio 18 2026
            architecture: ARM64
            artifact: valeria-windows-vs2026-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Windows toolchain
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"
          cmake --version

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.1"
          }

          $messages = @()
          $files = Get-ChildItem windows-mirror -Recurse -File -Filter *.ps1
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref] $tokens,
                  [ref] $errors
              )

              foreach ($error in @($errors)) {
                  $messages += (
                      "{0}:{1}:{2}: {3}" -f
                      $file.FullName,
                      $error.Extent.StartLineNumber,
                      $error.Extent.StartColumnNumber,
                      $error.Message
                  )
              }
          }

          if ($messages.Count -gt 0) {
              $messages | ForEach-Object { Write-Host $_ }
              throw "$($messages.Count) PowerShell parse error(s)"
          }

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $issues = @(
              Invoke-ScriptAnalyzer `
                  -Path windows-mirror `
                  -Recurse `
                  -Severity Error
          )
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) {
              throw "$($issues.Count) PSScriptAnalyzer error(s)"
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S windows-mirror `
            -B windows-build `
            -G "${{ matrix.generator }}" `
            -A "${{ matrix.architecture }}" `
            -DVALERIA_BUILD_TESTS=ON `
            -DVALERIA_BUILD_ACTIVATOR=ON

      - name: Build
        shell: pwsh
        run: cmake --build windows-build --config Release --parallel

      - name: Run protocol tests
        shell: pwsh
        run: |
          ctest `
            --test-dir windows-build `
            -C Release `
            --output-on-failure `
            --no-tests=error

      - name: Smoke-test Windows executables
        shell: pwsh
        run: |
          & .\windows-build\Release\iphone-valeria-mirror.exe --help
          if ($LASTEXITCODE -ne 0) {
              throw "iphone-valeria-mirror.exe --help failed"
          }

          & .\windows-build\activation\Release\valeria-activate.exe --help
          if ($LASTEXITCODE -ne 0) {
              throw "valeria-activate.exe --help failed"
          }

      - name: Upload Windows test package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            windows-build/Release/iphone-valeria-mirror.exe
            windows-build/Release/valeria_core_tests.exe
            windows-build/activation/Release/valeria-activate.exe
            windows-mirror/scripts/
            windows-mirror/README.md
            windows-mirror/driver/README.md
            windows-mirror/THIRD_PARTY_NOTICES.md
            windows-mirror/LICENSES/
